          type: string
          example: an.nguyen@example.com
          maxLength: 255
        roleCode:
          type: string
          enum:
            - BRANCH_MANAGER
            - STAFF
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - displayName
        - email
        - roleCode
        - branchId
    UserDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        displayName:
          type: string
          example: Long Hoàng
        maskedEmail:
          type: string
          example: lo***@dctd.vn
        userType:
          type: string
          enum:
            - STAFF
            - SYSTEM
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
            - INACTIVE
        permissionVersion:
          type: number
          example: 1
        failedLoginAttempts:
          type: number
          example: 0
          minimum: 0
        mustChangePassword:
          type: boolean
          example: false
        lockedAt:
          type: string
          format: date-time
        lockReason:
          type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/UserRoleAssignmentDto"
      required:
        - id
        - displayName
        - maskedEmail
        - userType
        - status
        - permissionVersion
        - failedLoginAttempts
        - mustChangePassword
        - assignments
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    LockStaffUserDto:
      type: object
      properties:
        reason:
          type: string
          example: Nhân viên đã nghỉ việc
          minLength: 3
          maxLength: 255
      required:
        - reason
    RoleListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleDto"
        total:
          type: number
      required:
        - items
        - total
    CreateRoleDto:
      type: object
      properties:
        code:
          type: string
          example: WAREHOUSE_LEAD
          description: Mã vai trò, chữ in hoa và gạch dưới, duy nhất toàn hệ thống
        name:
          type: string
          example: Trưởng kho
          maxLength: 255
        description:
          type: string
          example: Phụ trách nhập xuất kho chi nhánh
          maxLength: 1000
        permissionCodes:
          example:
            - inventory.stock.view
            - inventory.stock.adjust
          type: array
          items:
            type: string
      required:
        - code
        - name
        - permissionCodes
    RoleDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          example: BRANCH_MANAGER
        name:
          type: string
          example: Branch Manager
        description:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        system:
          type: boolean
        permissionCodes:
          type: array
          items:
            type: string
        version:
          type: number
          example: 0
      required:
        - id
        - code
        - name
        - status
        - system
        - permissionCodes
        - version
    PermissionListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PermissionDto"
        total:
          type: number
      required:
        - items
        - total
    ActiveLookupResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActiveLookupOptionDto"
