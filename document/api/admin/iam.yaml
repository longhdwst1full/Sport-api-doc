    UpdateRoleDto:
      type: object
      properties:
        name:
          type: string
          example: Trưởng kho
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        permissionCodes:
          description: Danh sách quyền thay thế toàn bộ. Bỏ trống để giữ nguyên quyền hiện tại.
          type: array
          items:
            type: string
        expectedVersion:
          type: number
          example: 0
          minimum: 0
          description: Version đọc được lần gần nhất
      required:
        - expectedVersion
    DeleteRoleDto:
      type: object
      properties:
        expectedVersion:
          type: number
          example: 0
          minimum: 0
          description: Version đọc được lần gần nhất
        reason:
          type: string
          example: Vai trò không còn dùng
          minLength: 3
          maxLength: 255
      required:
        - expectedVersion
        - reason
    AssignUserRoleDto:
      type: object
      properties:
        roleCode:
          type: string
          enum:
            - BRANCH_MANAGER
            - STAFF
          example: BRANCH_MANAGER
        scopeType:
          type: string
          enum:
            - BRANCH
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
