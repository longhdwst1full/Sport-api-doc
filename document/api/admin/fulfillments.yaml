components:
  schemas:
    FulfillmentStatus:
      type: string
      enum:
        - PENDING
        - PICKING
        - PACKED
        - SHIPPED
        - DELIVERED
        - DELIVERY_FAILED
        - RETURNING_TO_WAREHOUSE
        - RETURNED_TO_WAREHOUSE
        - CANCELLED
    AdminFulfillmentListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FulfillmentSummaryDto"
        page:
          type: number
        limit:
          type: number
        total:
          type: number
      required:
        - items
        - page
        - limit
        - total
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    FulfillmentDetailDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        fulfillmentNo:
          type: string
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        warehouseId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        warehouseName:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/FulfillmentStatus"
        carrierCode:
          type: string
          nullable: true
        trackingNo:
          type: string
          nullable: true
        carrierShipmentStatus:
          nullable: true
          description: Vận đơn GHN tự tạo sau thanh toán/xác nhận COD. null = không áp dụng (tạo vận đơn lúc ship như trước).
          allOf:
            - $ref: "#/components/schemas/CarrierShipmentStatus"
        carrierShipmentError:
          type: string
          nullable: true
          description: Lý do lần tạo vận đơn gần nhất thất bại
        recipientName:
          type: string
        recipientPhone:
          type: string
        recipientEmail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        version:
          type: string
        orderStatus:
          type: string
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        pickedAt:
          type: string
          format: date-time
          nullable: true
        packedAt:
          type: string
          format: date-time
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        deliveryFailureReasonCode:
          type: string
          nullable: true
        returnedToWarehouseAt:
          type: string
          format: date-time
          nullable: true
        returnCondition:
          type: string
          nullable: true
        history:
          type: array
          items:
            $ref: "#/components/schemas/FulfillmentHistoryDto"
      required:
        - id
        - fulfillmentNo
        - orderId
        - orderNo
        - warehouseId
        - warehouseName
        - status
        - recipientName
        - recipientPhone
        - createdAt
        - version
        - orderStatus
        - paymentStatus
        - paymentMethod
        - history
    FulfillmentTransitionDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        note:
          type: string
          maxLength: 500
      required:
        - expectedVersion
    ShipFulfillmentDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        note:
          type: string
          maxLength: 500
        carrierCode:
          type: string
          maxLength: 64
        trackingNo:
          type: string
          maxLength: 128
      required:
        - expectedVersion
    FulfillmentLabelDto:
      type: object
      properties:
        trackingNo:
          type: string
          example: LXQ7A9
        labelUrl:
          type: string
          description: URL in phiếu giao do hãng vận chuyển phát hành; chỉ có hiệu lực trong vài phút
      required:
        - trackingNo
        - labelUrl
    FailDeliveryDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        note:
          type: string
          maxLength: 500
        reasonCode:
          type: string
          minLength: 2
          maxLength: 64
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
        - expectedVersion
        - reasonCode
        - reason
    ReceiveReturnDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        note:
          type: string
          maxLength: 500
        condition:
          allOf:
            - $ref: "#/components/schemas/ReturnCondition"
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
        - expectedVersion
        - condition
        - reason
    FulfillmentSummaryDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        fulfillmentNo:
          type: string
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        warehouseId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        warehouseName:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/FulfillmentStatus"
        carrierCode:
          type: string
          nullable: true
        trackingNo:
          type: string
          nullable: true
        carrierShipmentStatus:
          nullable: true
          description: Vận đơn GHN tự tạo sau thanh toán/xác nhận COD. null = không áp dụng (tạo vận đơn lúc ship như trước).
          allOf:
            - $ref: "#/components/schemas/CarrierShipmentStatus"
        carrierShipmentError:
          type: string
          nullable: true
          description: Lý do lần tạo vận đơn gần nhất thất bại
        recipientName:
          type: string
        recipientPhone:
          type: string
        recipientEmail:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        version:
          type: string
      required:
        - id
        - fulfillmentNo
        - orderId
        - orderNo
        - warehouseId
        - warehouseName
        - status
        - recipientName
        - recipientPhone
        - createdAt
        - version
    ErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: name
        code:
          type: string
          example: INVALID_VALUE
        message:
          type: string
          example: 'Trường "name": Trường này không được để trống.'
      required:
        - code
        - message
    CarrierShipmentStatus:
      type: string
      enum:
        - PENDING
        - CREATING
        - CREATED
        - CREATE_FAILED
      description: Vận đơn GHN tự tạo sau thanh toán/xác nhận COD. null = không áp dụng (tạo vận đơn lúc ship như trước).
    FulfillmentHistoryDto:
      type: object
      properties:
        sequenceNo:
          type: number
        fromStatus:
          type: string
          nullable: true
        toStatus:
          allOf:
            - $ref: "#/components/schemas/FulfillmentStatus"
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - sequenceNo
        - toStatus
        - createdAt
    ReturnCondition:
      type: string
      enum:
        - SELLABLE
        - DAMAGED
        - MISSING
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
