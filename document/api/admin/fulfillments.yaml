        expectedVersion:
          type: string
          pattern: ^\d+$
        note:
          type: string
          maxLength: 500
        reasonCode:
          type: string
          minLength: 2
          maxLength: 64
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
        - expectedVersion
        - reasonCode
        - reason
    ReceiveReturnDto:
      type: object
