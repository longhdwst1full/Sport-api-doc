          nullable: true
        trackingNo:
          type: string
          nullable: true
        recipientName:
          type: string
        recipientPhone:
          type: string
        createdAt:
          type: string
          format: date-time
        version:
          type: string
        orderStatus:
          type: string
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        pickedAt:
          type: string
          format: date-time
          nullable: true
        packedAt:
          type: string
          format: date-time
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
