          items:
            $ref: "#/components/schemas/FulfillmentHistoryDto"
      required:
        - id
        - fulfillmentNo
        - orderId
        - orderNo
        - warehouseId
        - warehouseName
        - status
        - recipientName
        - recipientPhone
        - createdAt
        - version
        - orderStatus
        - paymentStatus
        - paymentMethod
        - history
    FulfillmentTransitionDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        note:
          type: string
          maxLength: 500
      required:
        - expectedVersion
    ShipFulfillmentDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        note:
          type: string
          maxLength: 500
        carrierCode:
