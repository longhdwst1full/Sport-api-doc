    AdminOrderSummaryDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        status:
          type: string
          enum:
            - PENDING_CONFIRMATION
            - CONFIRMED
            - PICKING
            - PACKED
            - SHIPPED
            - DELIVERED
            - COMPLETED
            - CANCELLED
        paymentStatus:
          type: string
          enum:
            - PENDING
            - AWAITING_CONFIRMATION
            - NEED_REVIEW
            - SUCCESS
            - FAILED
            - CANCELLED
            - REFUNDED
        fulfillmentStatus:
          type: string
          enum:
            - PENDING
            - PICKING
            - PACKED
            - SHIPPED
            - DELIVERED
            - FAILED
            - RETURNED
            - CANCELLED
        paymentMethod:
          type: string
        shippingMethod:
          type: string
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        branchName:
          type: string
        warehouseName:
          type: string
        grandTotal:
          type: string
        itemCount:
          type: number
        recipient:
          $ref: "#/components/schemas/OrderRecipientDto"
        placedAt:
          type: string
          format: date-time
        version:
          type: number
      required:
        - id
        - orderNo
        - status
        - paymentStatus
        - fulfillmentStatus
        - paymentMethod
        - shippingMethod
        - branchId
        - branchName
        - warehouseName
        - grandTotal
        - itemCount
        - recipient
        - placedAt
        - version
    PosCatalogComponentDto:
      type: object
      properties:
        productVariantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
          example: HQ-909S
        name:
          type: string
          example: Giàn tạ đa năng HQ-909S
        quantity:
          type: number
          example: 2
          description: Số lượng thành phần trong một combo
      required:
        - productVariantId
        - sku
        - name
        - quantity
    OrderItemComponentDto:
      type: object
      properties:
        productVariantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
        name:
          type: string
        quantityPerBundle:
          type: number
        totalQuantity:
          type: number
      required:
        - productVariantId
        - sku
        - name
        - quantityPerBundle
        - totalQuantity
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
