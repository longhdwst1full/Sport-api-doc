components:
  schemas:
    PosCatalogResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosCatalogItemDto"
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          example: 42
        hasMore:
          type: boolean
          example: true
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Chi nhánh đã dùng để tính tồn
      required:
        - items
        - page
        - limit
        - total
        - hasMore
        - branchId
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    CreatePosOrderDto:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/PosCustomerDto"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PosOrderItemDto"
        paymentMethod:
          type: string
          enum:
            - CASH
            - BANK_TRANSFER
            - COD
          example: CASH
        delivery:
          description: "Bỏ trống: khách nhận ngay tại quầy như cũ. Có giá trị: đơn đi giao hàng, tồn kho vẫn đặt chỗ như luồng checkout của khách."
          allOf:
            - $ref: "#/components/schemas/PosDeliveryAddressDto"
        handOverImmediately:
          type: boolean
          description: Chạy luôn hết vòng giao hàng và đánh dấu đã giao. Mặc định bật cho đơn tại quầy và tắt cho đơn giao hàng; bật cho đơn giao hàng khi khách lấy ngay tại cửa hàng.
        note:
          type: string
          maxLength: 1000
          description: Ghi chú tại quầy; lưu kèm đơn để truy vết về sau
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          description: Chi nhánh bán. BẮT BUỘC với tài khoản phạm vi toàn hệ thống vì họ không gắn chi nhánh nào. Tài khoản thuộc một chi nhánh thì bỏ trống, hoặc truyền đúng chi nhánh của mình.
      required:
        - customer
        - items
        - paymentMethod
    OrderDetailDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        status:
          type: string
          enum:
            - PENDING_CONFIRMATION
            - CONFIRMED
            - PICKING
            - PACKED
            - SHIPPED
            - DELIVERED
            - COMPLETED
            - CANCELLED
        paymentStatus:
          type: string
          enum:
            - PENDING
            - AWAITING_CONFIRMATION
            - NEED_REVIEW
            - SUCCESS
            - FAILED
            - CANCELLED
            - REFUNDED
        fulfillmentStatus:
          type: string
          enum:
            - PENDING
            - PICKING
            - PACKED
            - SHIPPED
            - DELIVERED
            - FAILED
            - RETURNED
            - CANCELLED
        paymentMethod:
          type: string
        shippingMethod:
          type: string
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        branchName:
          type: string
        warehouseName:
          type: string
        grandTotal:
          type: string
        itemCount:
          type: number
        recipient:
          $ref: "#/components/schemas/OrderRecipientDto"
        placedAt:
          type: string
          format: date-time
        version:
          type: number
        currencyCode:
          type: string
        pricesIncludeTax:
          type: boolean
        subtotal:
          type: string
        discountTotal:
          type: string
        shippingTotal:
          type: string
        taxTotal:
          type: string
        customerNote:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemDto"
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusHistoryDto"
      required:
        - id
        - orderNo
        - status
        - paymentStatus
        - fulfillmentStatus
        - paymentMethod
        - shippingMethod
        - branchId
        - branchName
        - warehouseName
        - grandTotal
        - itemCount
        - recipient
        - placedAt
        - version
        - currencyCode
        - pricesIncludeTax
        - subtotal
        - discountTotal
        - shippingTotal
        - taxTotal
        - items
        - statusHistory
    AdminOrderListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrderSummaryDto"
        page:
          type: number
        limit:
          type: number
        total:
          type: number
      required:
        - items
        - page
        - limit
        - total
    OrderCancelCommandDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: Version đơn hàng mà người dùng đang xem
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - expectedVersion
        - reason
    ConfirmOrderCommandDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
          description: Version đơn hàng mà Admin đang xem
        note:
          type: string
          maxLength: 500
