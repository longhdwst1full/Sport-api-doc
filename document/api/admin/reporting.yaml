components:
  schemas:
    OverviewReportDto:
      type: object
      properties:
        ordersToday:
          type: number
          description: Đơn đặt trong ngày hôm nay
        ordersLast30Days:
          type: number
          description: Đơn đặt trong 30 ngày gần nhất
        ordersAwaitingFulfillment:
          type: number
          description: Đơn chưa giao xong
        ordersCancelledLast30Days:
          type: number
          description: Đơn đã huỷ trong 30 ngày
        publishedProducts:
          type: number
          description: Sản phẩm đang bán
        customers:
          type: number
          description: Khách hàng đã có tài khoản hoặc từng đặt hàng
        ordersByStatus:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusCountDto"
      required:
        - ordersToday
        - ordersLast30Days
        - ordersAwaitingFulfillment
        - ordersCancelledLast30Days
        - publishedProducts
        - customers
        - ordersByStatus
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    RevenueReportDto:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        completedRevenue:
          type: string
          description: "Doanh thu thực nhận: đơn đã COMPLETED, tính theo mốc hoàn tất"
        completedOrderCount:
          type: number
          description: Số đơn đã hoàn tất
        expectedRevenue:
          type: string
          description: "Dự thu: đơn đã DELIVERED, đang chờ tự chuyển hoàn tất"
        expectedOrderCount:
          type: number
          description: Số đơn đã giao, chờ hoàn tất
        inProgressRevenue:
          type: string
          description: Đơn đang xử lý (đã xác nhận tới đang giao); chưa tính vào hai nhóm trên
        averageOrderValue:
          type: string
          description: Giá trị trung bình mỗi đơn đã hoàn tất
        granularity:
          type: string
          enum:
            - DAY
            - MONTH
            - QUARTER
            - YEAR
          description: Mức gom đã áp dụng cho `series`
        series:
          description: Doanh thu thực nhận theo kỳ hoàn tất
          type: array
          items:
            $ref: "#/components/schemas/RevenuePointDto"
        byBranch:
          description: Bóc tách theo chi nhánh
          type: array
          items:
            $ref: "#/components/schemas/BranchRevenueDto"
      required:
        - from
        - to
        - completedRevenue
        - completedOrderCount
        - expectedRevenue
        - expectedOrderCount
        - inProgressRevenue
        - averageOrderValue
        - granularity
        - series
        - byBranch
    InventoryReportDto:
      type: object
      properties:
        trackedBalances:
          type: number
          description: Số dòng tồn đang theo dõi
        outOfStock:
          type: number
          description: Số dòng hết hàng bán (available <= 0)
        lowStock:
          type: number
          description: Số dòng chạm hoặc dưới ngưỡng đặt lại
        items:
          description: Danh sách cần nhập thêm, ưu tiên thiếu nhất
          type: array
          items:
            $ref: "#/components/schemas/LowStockItemDto"
      required:
        - trackedBalances
        - outOfStock
        - lowStock
        - items
    TopProductListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopProductDto"
      required:
        - items
    TopCustomerListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopCustomerDto"
      required:
        - items
    OrderStatusCountDto:
      type: object
      properties:
        status:
          type: string
          example: PENDING_CONFIRMATION
        count:
          type: number
          example: 12
      required:
        - status
        - count
    ErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: name
        code:
          type: string
          example: INVALID_VALUE
        message:
          type: string
          example: 'Trường "name": Trường này không được để trống.'
      required:
        - code
        - message
    RevenuePointDto:
      type: object
      properties:
        date:
          type: string
          example: 2026-09-15
          description: "Khoá kỳ theo mức gom: YYYY-MM-DD, YYYY-MM, YYYY-Qn hoặc YYYY."
        amount:
          type: string
          example: "15400000.00"
        orderCount:
          type: number
          example: 3
      required:
        - date
        - amount
        - orderCount
    BranchRevenueDto:
      type: object
      properties:
        branchName:
          type: string
        completedRevenue:
          type: string
        completedOrderCount:
          type: number
        expectedRevenue:
          type: string
      required:
        - branchName
        - completedRevenue
        - completedOrderCount
        - expectedRevenue
    LowStockItemDto:
      type: object
      properties:
        sku:
          type: string
        productName:
          type: string
        warehouseName:
          type: string
        onHand:
          type: number
          description: Tồn thực tế
        reserved:
          type: number
          description: Đang giữ cho đơn chưa xuất
        available:
          type: number
          description: Còn bán được = onHand - reserved
        reorderPoint:
          type: number
          description: Ngưỡng đặt lại hàng
      required:
        - sku
        - productName
        - warehouseName
        - onHand
        - reserved
        - available
        - reorderPoint
    TopProductDto:
      type: object
      properties:
        sku:
          type: string
        productName:
          type: string
        quantitySold:
          type: number
          description: Số lượng đã bán trong khoảng
        revenue:
          type: string
          description: Doanh thu đã thực nhận từ SKU này
      required:
        - sku
        - productName
        - quantitySold
        - revenue
    TopCustomerDto:
      type: object
      properties:
        customerNo:
          type: string
          example: KH-000128
        name:
          type: string
          example: Nguyễn Minh Anh
        orderCount:
          type: number
          description: Số đơn đã hoàn tất trong khoảng
        revenue:
          type: string
          description: Tổng tiền đã thực trả trong khoảng
      required:
        - customerNo
        - name
        - orderCount
        - revenue
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
