components:
  schemas:
    ReturnListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReturnSummaryDto"
        page:
          type: number
        limit:
          type: number
        total:
          type: number
      required:
        - items
        - page
        - limit
        - total
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    CreateAdminReturnDto:
      type: object
      properties:
        reasonCode:
          type: string
          enum:
            - DEFECTIVE
            - WRONG_ITEM
            - NOT_AS_DESCRIBED
            - WRONG_SIZE
            - CHANGED_MIND
            - OTHER
        description:
          type: string
          maxLength: 2000
        evidenceImages:
          maxItems: 5
          description: Ảnh minh chứng đã tải lên bằng chữ ký upload của đơn này. Ảnh và mô tả đều không bắt buộc
          type: array
          items:
            $ref: "#/components/schemas/ReturnEvidenceInputDto"
        items:
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/ReturnLineInputDto"
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        fault:
          type: string
          enum:
            - SHOP
            - CUSTOMER
          description: "Bắt buộc khi người tạo có quyền return.decide: phiếu được duyệt ngay (D56)"
        windowOverrideNote:
          type: string
          minLength: 5
          maxLength: 500
          description: Lý do nhận trả khi đã quá hạn; cần quyền return.window.override
      required:
        - reasonCode
        - items
        - orderId
    ReturnDetailDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        returnNo:
          type: string
          example: RMA-20260924-000001
        orderId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        orderNo:
          type: string
        status:
          type: string
          enum:
            - REQUESTED
            - APPROVED
            - REJECTED
            - RECEIVED
            - REFUNDED
            - CLOSED
            - CANCELLED
        channel:
          type: string
          enum:
            - ACCOUNT
            - ADMIN
        reasonCode:
          type: string
          enum:
            - DEFECTIVE
            - WRONG_ITEM
            - NOT_AS_DESCRIBED
            - WRONG_SIZE
            - CHANGED_MIND
            - OTHER
        fault:
          type: string
          enum:
            - SHOP
            - CUSTOMER
          nullable: true
        recipientName:
          type: string
        itemCount:
          type: number
        createdAt:
          type: string
          format: date-time
        version:
          type: string
        description:
          type: string
          nullable: true
        evidenceImages:
          type: array
          items:
            $ref: "#/components/schemas/ReturnEvidenceImageDto"
        deliveredAt:
          type: string
          format: date-time
        windowOverridden:
          type: boolean
        windowOverrideNote:
          type: string
          nullable: true
          description: Chỉ trả cho Admin
        decisionNote:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        receivedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        refundCap:
          type: string
          nullable: true
          description: Trần tiền hoàn, có sau khi nhận hàng
        estimatedRefundAmount:
          type: string
          description: Số tiền hoàn DỰ KIẾN để hiển thị; bằng refundCap sau khi nhận hàng, trước đó là ước tính có thể thay đổi
        refundedAmount:
          type: string
        pendingRefundAmount:
          type: string
        refundableAmount:
          type: string
          description: Số tiền còn được hoàn, đã chặn theo cả phiếu và số tiền đã thu
        allowedRefundMethods:
          type: array
          items:
            type: string
            enum:
              - CASH
              - BANK_TRANSFER
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReturnItemDto"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/RefundDto"
        history:
          type: array
          items:
            $ref: "#/components/schemas/ReturnHistoryDto"
      required:
        - id
