            - REJECTED
            - RECEIVED
            - REFUNDED
            - CLOSED
            - CANCELLED
        channel:
          type: string
          enum:
            - ACCOUNT
            - ADMIN
        reasonCode:
          type: string
          enum:
            - DEFECTIVE
            - WRONG_ITEM
            - NOT_AS_DESCRIBED
            - WRONG_SIZE
            - CHANGED_MIND
            - OTHER
        fault:
          type: string
          enum:
            - SHOP
            - CUSTOMER
          nullable: true
        recipientName:
          type: string
        itemCount:
          type: number
        createdAt:
          type: string
          format: date-time
        version:
          type: string
      required:
        - id
        - returnNo
        - orderId
        - orderNo
        - status
        - channel
        - reasonCode
        - recipientName
        - itemCount
        - createdAt
        - version
    ErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: name
        code:
          type: string
          example: INVALID_VALUE
        message:
          type: string
          example: 'Trường "name": Trường này không được để trống.'
      required:
        - code
        - message
    ReturnLineInputDto:
      type: object
      properties:
        orderItemId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        quantity:
          type: number
          minimum: 1
          description: Combo phải bằng toàn bộ số bộ còn trả được của dòng
      required:
