openapi: 3.0.0
info:
  title: DCTD-UTC Commerce API
  description: Contract for storefront and admin applications
  version: 1.0.0
  contact: {}
servers:
  - url: http://localhost:4000
    description: Local
paths:
  /api/v1/catalog/categories:
    get:
      operationId: listCatalogCategories
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogCategoryListDto"
      summary: List active storefront categories
      tags:
        - Storefront Catalog
  /api/v1/catalog/products:
    get:
      operationId: listCatalogProducts
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 12
            type: number
        - name: search
          required: false
          in: query
          description: Tìm gộp theo tên, mã sản phẩm hoặc SKU. Giữ cho tương thích ngược.
          schema:
            type: string
        - name: name
          required: false
          in: query
          description: Chỉ lọc theo tên sản phẩm
          schema:
            type: string
        - name: productNo
          required: false
          in: query
          description: Chỉ lọc theo mã sản phẩm
          schema:
            type: string
        - name: sku
          required: false
          in: query
          description: Chỉ lọc theo SKU của biến thể
          schema:
            type: string
        - name: category
          required: false
          in: query
          description: Slug danh mục; gồm cả nhánh con
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            $ref: "#/components/schemas/ProductStatus"
        - name: sort
          required: false
          in: query
          description: Giá so theo minPrice; sản phẩm chưa có giá luôn xếp cuối
          schema:
            $ref: "#/components/schemas/ProductListSort"
        - name: minPrice
          required: false
          in: query
          description: minPrice ≥ giá trị này (VND)
          schema:
            pattern: ^\d+(\.\d{1,2})?$
            example: "1000000"
            type: string
        - name: maxPrice
          required: false
          in: query
          description: minPrice ≤ giá trị này (VND)
          schema:
            pattern: ^\d+(\.\d{1,2})?$
            example: "5000000"
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponseDto"
      summary: List published products
      tags:
        - Storefront Catalog
  /api/v1/catalog/products/{slug}:
    get:
      operationId: getCatalogProduct
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      summary: Get product by slug
      tags:
        - Storefront Catalog
components:
  schemas:
    CatalogCategoryListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCategoryDto"
        total:
          type: number
      required:
        - items
        - total
    ProductStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - ARCHIVED
    ProductListSort:
      type: string
      enum:
        - NEWEST
        - PRICE_ASC
        - PRICE_DESC
        - NAME_ASC
    ProductListResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummaryDto"
        meta:
          $ref: "#/components/schemas/ProductListMetaDto"
      required:
        - items
        - meta
    ProductDetailDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        defaultVariantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
          description: Sellable variant represented by minPrice; use this ID for quick-add cart actions
        defaultVariantSku:
          type: string
          nullable: true
          description: Immutable SKU of defaultVariantId
        productNo:
          type: string
        name:
          type: string
        slug:
          type: string
        brand:
          type: string
        primaryCategory:
          type: string
        productType:
          allOf:
            - $ref: "#/components/schemas/ProductType"
        status:
          allOf:
            - $ref: "#/components/schemas/ProductStatus"
        isPublished:
          type: boolean
          example: true
          description: Có hiển thị trên website hay không. Tách khỏi status để ẩn tạm một sản phẩm đang bán mà không phải đẩy về DRAFT.
        version:
          type: number
          example: 0
        minPrice:
          type: string
          example: "18990000.00"
          nullable: true
        currency:
          example: VND
          allOf:
            - $ref: "#/components/schemas/CurrencyCode"
        imageUrl:
          type: string
          format: uri
          nullable: true
        shortDescription:
          type: string
          nullable: true
          description: Mô tả ngắn cho thẻ sản phẩm
        inStock:
          type: boolean
          description: Có ít nhất một SKU đang bán còn hàng ở một kho chi nhánh đang hoạt động. Có trong mọi response danh sách và chi tiết; response của lệnh ghi không tính. Không lộ số lượng tồn.
        specifications:
          description: Thông số kỹ thuật đã ghép nhãn/đơn vị từ từ điển thuộc tính; rỗng nếu chưa nhập
          type: array
          items:
            $ref: "#/components/schemas/ProductSpecificationDto"
        brandId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        primaryCategoryId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        description:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantDto"
        media:
          type: array
          items:
            $ref: "#/components/schemas/ProductMediaDto"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ProductCategoryDto"
        categoryIds:
          example:
            - "1"
          type: array
          items:
            type: string
            pattern: ^[1-9][0-9]*$
      required:
        - id
        - productNo
        - name
        - slug
        - productType
        - status
        - isPublished
        - version
        - currency
        - specifications
        - variants
        - media
        - categories
        - categoryIds
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    CatalogCategoryDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        sortOrder:
          type: number
        productCount:
          type: number
          description: Số sản phẩm PUBLISHED thuộc danh mục
        depth:
          type: number
          description: Độ sâu trong cây danh mục; 0 là danh mục gốc
        parentSlug:
          type: string
          nullable: true
          description: Slug danh mục cha; null nếu là danh mục gốc. Dùng để dựng menu nhiều cấp.
      required:
        - code
        - name
        - slug
        - sortOrder
        - productCount
        - depth
    ProductSummaryDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        defaultVariantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
          description: Sellable variant represented by minPrice; use this ID for quick-add cart actions
        defaultVariantSku:
          type: string
          nullable: true
          description: Immutable SKU of defaultVariantId
        productNo:
          type: string
        name:
          type: string
        slug:
          type: string
        brand:
          type: string
        primaryCategory:
          type: string
        productType:
          allOf:
            - $ref: "#/components/schemas/ProductType"
        status:
          allOf:
            - $ref: "#/components/schemas/ProductStatus"
        isPublished:
          type: boolean
          example: true
          description: Có hiển thị trên website hay không. Tách khỏi status để ẩn tạm một sản phẩm đang bán mà không phải đẩy về DRAFT.
        version:
          type: number
          example: 0
        minPrice:
          type: string
          example: "18990000.00"
          nullable: true
        currency:
          example: VND
          allOf:
            - $ref: "#/components/schemas/CurrencyCode"
        imageUrl:
          type: string
          format: uri
          nullable: true
        shortDescription:
          type: string
          nullable: true
          description: Mô tả ngắn cho thẻ sản phẩm
        inStock:
          type: boolean
          description: Có ít nhất một SKU đang bán còn hàng ở một kho chi nhánh đang hoạt động. Có trong mọi response danh sách và chi tiết; response của lệnh ghi không tính. Không lộ số lượng tồn.
      required:
        - id
        - productNo
        - name
        - slug
        - productType
        - status
        - isPublished
        - version
        - currency
    ProductListMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 12
        total:
          type: number
          example: 2
        totalPages:
          type: number
          example: 1
      required:
        - page
        - limit
        - total
        - totalPages
    ProductType:
      type: string
      enum:
        - STANDARD
        - BUNDLE
    CurrencyCode:
      type: string
      enum:
        - VND
    ProductSpecificationDto:
      type: object
      properties:
        code:
          type: string
          example: ADJUSTABLE_HEIGHT
        name:
          type: string
          example: Chiều cao điều chỉnh
        dataType:
          allOf:
            - $ref: "#/components/schemas/AttributeDataType"
        unit:
          type: string
          nullable: true
        values:
          type: array
          items:
            $ref: "#/components/schemas/ProductSpecificationValueDto"
      required:
        - code
        - name
        - dataType
        - values
    ProductVariantDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        weightGrams:
          type: number
          minimum: 0
        lengthMm:
          type: number
          minimum: 1
          nullable: true
        widthMm:
          type: number
          minimum: 1
          nullable: true
        heightMm:
          type: number
          minimum: 1
          nullable: true
        status:
          allOf:
            - $ref: "#/components/schemas/ProductVariantStatus"
        version:
          type: number
          example: 0
        effectivePrice:
          type: string
          example: "18990000.00"
          nullable: true
        effectivePriceId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        effectivePriceVersion:
          type: number
          example: 0
          nullable: true
        bundle:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ProductBundleDto"
        inStock:
          type: boolean
          description: Còn hàng ở ít nhất một kho chi nhánh đang hoạt động (tồn thực − đang giữ ≥ 1; combo tính theo thành phần thiếu nhất). Chỉ có ở getCatalogProduct/getAdminProduct; response của lệnh ghi không tính.
      required:
        - id
        - sku
        - name
        - weightGrams
        - status
        - version
    ProductMediaDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        mediaAssetId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        variantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        secureUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
        altText:
          type: string
          nullable: true
        sortOrder:
          type: number
          minimum: 0
        isPrimary:
          type: boolean
        status:
          allOf:
            - $ref: "#/components/schemas/ProductMediaStatus"
      required:
        - id
        - mediaAssetId
        - secureUrl
        - sortOrder
        - isPrimary
        - status
    ProductCategoryDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        name:
          type: string
        isPrimary:
          type: boolean
      required:
        - id
        - name
        - isPrimary
    ErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: name
        code:
          type: string
          example: INVALID_VALUE
        message:
          type: string
          example: 'Trường "name": Trường này không được để trống.'
      required:
        - code
        - message
    AttributeDataType:
      type: string
      enum:
        - TEXT
        - NUMBER
        - BOOLEAN
        - OPTION
    ProductSpecificationValueDto:
      type: object
      properties:
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        label:
          type: string
          example: 2.25 m
          description: Nhãn hiển thị đã ghép đơn vị / nhãn lựa chọn
      required:
        - value
        - label
    ProductVariantStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    ProductBundleDto:
      type: object
      properties:
        bundleType:
          allOf:
            - $ref: "#/components/schemas/ProductBundleType"
        status:
          allOf:
            - $ref: "#/components/schemas/ProductBundleStatus"
        components:
          type: array
          items:
            $ref: "#/components/schemas/BundleComponentDto"
      required:
        - bundleType
        - status
        - components
    ProductMediaStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    ProductBundleType:
      type: string
      enum:
        - FIXED_VIRTUAL
    ProductBundleStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    BundleComponentDto:
      type: object
      properties:
        componentVariantId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        componentSku:
          type: string
        componentName:
          type: string
        quantity:
          type: number
          minimum: 1
      required:
        - componentVariantId
        - componentSku
        - componentName
        - quantity
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
