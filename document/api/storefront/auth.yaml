components:
  schemas:
    RegisterCustomerDto:
      type: object
      properties:
        displayName:
          type: string
          example: Nguyễn Minh Anh
          maxLength: 255
        email:
          type: string
          example: minh.anh@example.com
          maxLength: 255
        phone:
          type: string
          example: 0912 345 678
          maxLength: 32
          description: Vietnamese phone; stored in E.164 format
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
      required:
        - displayName
        - password
    TokenPairDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Returned only in BODY transport; COOKIE transport uses an HttpOnly cookie
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          example: 900
        mustChangePassword:
          type: boolean
          example: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - mustChangePassword
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    LoginDto:
      type: object
      properties:
        identifier:
          type: string
          example: owner@example.com
          description: Email or Vietnamese phone number
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
        rememberMe:
          type: boolean
          example: false
          default: false
          description: Keep the refresh cookie after the browser closes. Omitted or false creates a session cookie.
      required:
        - identifier
        - password
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: Required in BODY transport; omitted when the refresh token is in HttpOnly cookie
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          example: minh.anh@example.com
          maxLength: 255
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: Token lấy từ đường dẫn trong email; dùng một lần và có hạn.
          minLength: 32
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
      required:
        - token
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Leading and trailing whitespace is ignored
      required:
        - currentPassword
        - newPassword
    CurrentUserDto:
      type: object
      properties:
        userId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        displayName:
          type: string
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AuthScopeDto"
        permissionVersion:
          type: string
          example: "3"
          description: Changes whenever the user role/permission set changes; clients use it as a cache key for permission-derived UI such as navigation menus
        mustChangePassword:
          type: boolean
          example: false
      required:
        - userId
        - displayName
        - permissions
        - scopes
        - permissionVersion
        - mustChangePassword
    ErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: name
        code:
          type: string
          example: INVALID_VALUE
        message:
          type: string
          example: 'Trường "name": Trường này không được để trống.'
      required:
        - code
        - message
    AuthScopeDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - GLOBAL
            - BRANCH
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - type
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
