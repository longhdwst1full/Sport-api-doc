          description: Doanh thu gộp của đơn hoàn tất trong kỳ
        orderCount:
          type: number
          example: 3
        refundAmount:
          type: string
          example: "500000.00"
          description: Tiền đã hoàn thành công trong kỳ (theo mốc hoàn tiền)
        netAmount:
          type: string
          example: "14900000.00"
