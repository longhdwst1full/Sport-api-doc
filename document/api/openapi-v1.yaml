    BranchRevenueDto:
      type: object
      properties:
        branchName:
          type: string
        completedRevenue:
          type: string
        completedOrderCount:
          type: number
        expectedRevenue:
          type: string
        refundedAmount:
          type: string
          description: Tiền đã hoàn thành công trong kỳ của chi nhánh
        netRevenue:
          type: string
          description: completedRevenue - refundedAmount
      required:
        - branchName
        - completedRevenue
        - completedOrderCount
        - expectedRevenue
        - refundedAmount
        - netRevenue
    RevenueReportDto:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        completedRevenue:
          type: string
          description: "Doanh thu thực nhận: đơn đã COMPLETED, tính theo mốc hoàn tất"
        completedOrderCount:
          type: number
          description: Số đơn đã hoàn tất
        expectedRevenue:
          type: string
          description: "Dự thu: đơn đã DELIVERED, đang chờ tự chuyển hoàn tất"
        expectedOrderCount:
          type: number
          description: Số đơn đã giao, chờ hoàn tất
        inProgressRevenue:
          type: string
          description: Đơn đang xử lý (đã xác nhận tới đang giao); chưa tính vào hai nhóm trên
        refundedAmount:
          type: string
          description: Tiền đã hoàn thành công (refund SUCCEEDED) trong kỳ, cắt theo mốc hoàn tiền; gồm cả hoàn một phần
        refundCount:
          type: number
          description: Số lượt hoàn tiền thành công trong kỳ
        netRevenue:
          type: string
          description: Doanh thu thuần = completedRevenue - refundedAmount
        averageOrderValue:
          type: string
          description: Giá trị trung bình mỗi đơn đã hoàn tất (gộp, trước hoàn tiền)
        granularity:
          description: Mức gom đã áp dụng cho `series`
          allOf:
            - $ref: "#/components/schemas/ReportGranularity"
        series:
          description: Doanh thu thực nhận theo kỳ hoàn tất
          type: array
          items:
            $ref: "#/components/schemas/RevenuePointDto"
        byBranch:
          description: Bóc tách theo chi nhánh
          type: array
          items:
            $ref: "#/components/schemas/BranchRevenueDto"
      required:
        - from
        - to
        - completedRevenue
        - completedOrderCount
        - expectedRevenue
        - expectedOrderCount
        - inProgressRevenue
        - refundedAmount
        - refundCount
        - netRevenue
        - averageOrderValue
        - granularity
        - series
        - byBranch
