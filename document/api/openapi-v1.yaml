          description: Mốc đầu khoảng thống kê. Bỏ trống thì lấy 30 ngày gần nhất.
          schema:
            format: date-time
            type: string
        - name: to
          required: false
          in: query
          description: Mốc cuối; bỏ trống là hiện tại.
          schema:
            format: date-time
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 10
            type: number
        - name: format
          required: false
          in: query
          schema:
            $ref: "#/components/schemas/ReportExportFormat"
      responses:
        "200":
          description: File báo cáo, tên file nằm trong header Content-Disposition.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Tải danh sách khách mua nhiều nhất ra file CSV hoặc XLSX
      tags:
        - Admin Reporting
      x-required-permissions:
        - report.revenue.view
  /api/v1/admin/reports/inventory/export:
    get:
      operationId: exportAdminReportInventory
      parameters:
        - name: format
          required: false
          in: query
          schema:
            $ref: "#/components/schemas/ReportExportFormat"
      responses:
        "200":
          description: File báo cáo, tên file nằm trong header Content-Disposition.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseDto"
      security:
        - bearer: []
      summary: Tải danh sách tồn kho cần nhập thêm ra file CSV hoặc XLSX
      tags:
        - Admin Reporting
      x-required-permissions:
        - report.inventory.view
info:
  title: DCTD-UTC Commerce API
  description: Contract for storefront and admin applications
  version: 1.0.0
  contact: {}
tags: []
servers:
  - url: http://localhost:4000
    description: Local
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    DatabaseHealthDto:
      type: object
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum:
            - up
            - down
            - disabled
      required:
        - enabled
        - status
    HealthResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          example: ok
        service:
          type: string
          example: dctd-api
        version:
          type: string
          example: 0.1.0
        timestamp:
          type: string
          format: date-time
        database:
          $ref: "#/components/schemas/DatabaseHealthDto"
      required:
        - status
        - service
        - version
        - timestamp
        - database
    CapabilityReadinessStatus:
      type: string
      enum:
        - READY
        - DISABLED
        - MISCONFIGURED
        - UNKNOWN
      description: "READY: đủ tham số. DISABLED: cố tình tắt, không phải lỗi. MISCONFIGURED: đang bật nhưng thiếu tham số — đây là thứ cần sửa. UNKNOWN: chưa đọc được tham số để kết luận."
    CapabilityReadinessDto:
      type: object
      properties:
        name:
          type: string
          example: SHIPPING_GHN
        enabled:
          type: boolean
          description: Năng lực có đang được bật hay không
        status:
          description: "READY: đủ tham số. DISABLED: cố tình tắt, không phải lỗi. MISCONFIGURED: đang bật nhưng thiếu tham số — đây là thứ cần sửa. UNKNOWN: chưa đọc được tham số để kết luận."
          allOf:
            - $ref: "#/components/schemas/CapabilityReadinessStatus"
        missing:
          example:
            - GHN_TOKEN
          description: TÊN tham số còn thiếu. Không bao giờ chứa giá trị tham số.
          type: array
          items:
            type: string
      required:
        - name
        - enabled
        - status
        - missing
    ConfigReadinessDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityReadinessDto"
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - capabilities
        - timestamp
    ErrorDetailDto:
      type: object
      properties:
        field:
          type: string
          example: name
        code:
          type: string
          example: INVALID_VALUE
        message:
          type: string
          example: 'Trường "name": Trường này không được để trống.'
      required:
        - code
        - message
    ErrorResponseDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu gửi lên không hợp lệ.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetailDto"
        path:
          type: string
          example: /api/v1/catalog/products
        method:
          type: string
          example: POST
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
      required:
        - statusCode
        - code
        - message
        - path
        - method
        - timestamp
    SystemModuleDto:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - SCAFFOLDED
        tables:
          type: array
          items:
            type: string
        p0Count:
          type: number
        p1Count:
          type: number
      required:
        - key
        - name
        - status
        - tables
        - p0Count
        - p1Count
    SystemModuleListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SystemModuleDto"
        totalModels:
          type: number
          example: 74
        p0Models:
          type: number
          example: 43
        p1Models:
          type: number
          example: 31
      required:
        - items
        - totalModels
        - p0Models
        - p1Models
    SystemParameterGroup:
      type: string
      enum:
        - SHIPPING
        - CHECKOUT
        - ORDER
        - PAYMENT
        - CART
        - PROMOTION
        - INTEGRATION
    SystemParameterStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    SystemParameterSortField:
      type: string
      enum:
        - id
        - code
        - groupCode
        - sortOrder
        - updatedAt
    SystemParameterValueType:
      type: string
      enum:
        - INTEGER
        - DECIMAL
        - BOOLEAN
        - STRING
    SystemParameterDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          description: Mã ổn định dùng trong code; không đổi được từ giao diện
        groupCode:
          allOf:
            - $ref: "#/components/schemas/SystemParameterGroup"
        label:
          type: string
        description:
          type: string
          nullable: true
        valueType:
          allOf:
            - $ref: "#/components/schemas/SystemParameterValueType"
        value:
          type: string
          description: Giá trị đang áp dụng, luôn ở dạng chuỗi
        defaultValue:
          type: string
          description: Giá trị mặc định khi chưa cấu hình hoặc giá trị hỏng
        minValue:
          type: number
          nullable: true
        maxValue:
          type: number
          nullable: true
        unit:
          type: string
          nullable: true
        status:
          type: string
        isPublic:
          type: boolean
          description: Storefront được phép đọc tham số này qua API công khai
        isSystem:
          type: boolean
          description: "Tham số hệ thống: code đang đọc theo mã, chỉ sửa được giá trị"
        isSecret:
          type: boolean
          description: "Bí mật nhà cung cấp: giá trị không đọc lại được qua API, chỉ ghi đè. Trường value trả về dấu che nếu đã cấu hình và chuỗi rỗng nếu chưa."
        remarks:
          type: string
          nullable: true
          description: Ghi chú của lần sửa gần nhất
        version:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
      required:
        - id
        - code
        - groupCode
        - label
        - valueType
        - value
        - defaultValue
        - status
        - isPublic
        - isSystem
        - isSecret
        - version
        - updatedAt
    SystemParameterListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SystemParameterDto"
        page:
          type: number
        limit:
          type: number
        total:
          type: number
      required:
        - items
        - page
        - limit
        - total
    UpdateSystemParameterDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        value:
          type: string
          description: Giá trị mới ở dạng chuỗi; server kiểm tra kiểu và khoảng hợp lệ
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: Lý do thay đổi (không bắt buộc); actor/time/value vẫn được audit
      required:
        - expectedVersion
        - value
    CreateSystemParameterDto:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 64
          description: Mã viết hoa, dùng gạch dưới
        groupCode:
          allOf:
            - $ref: "#/components/schemas/SystemParameterGroup"
        label:
          type: string
          maxLength: 255
        description:
          type: string
        valueType:
          allOf:
            - $ref: "#/components/schemas/SystemParameterValueType"
        value:
          type: string
          maxLength: 500
        minValue:
          type: number
          nullable: true
        maxValue:
          type: number
          nullable: true
        unit:
          type: string
          maxLength: 32
        isPublic:
          type: boolean
          default: false
          description: Cho phép Storefront đọc qua API công khai
        remarks:
          type: string
          maxLength: 500
      required:
        - code
        - groupCode
        - label
        - valueType
        - value
    DeleteSystemParameterDto:
      type: object
      properties:
        expectedVersion:
          type: string
          pattern: ^\d+$
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: Lý do nếu người thao tác muốn ghi thêm vào audit
      required:
        - expectedVersion
    AuditLogDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        requestId:
          type: string
        sequenceNo:
          type: number
        actorType:
          type: string
        actorUserId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
          nullable: true
        actorDisplayName:
          type: string
          nullable: true
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          pattern: ^(?:[1-9][0-9]*|[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,})$
          example: "1"
          description: Numeric entity ID, or a historical UUID retained by migrated audit/ledger data
          nullable: true
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - requestId
        - sequenceNo
        - actorType
        - action
        - entityType
        - createdAt
    AuditListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogDto"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
    OrganizationStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    AddressDto:
      type: object
      properties:
        addressLine:
          type: string
          example: 123 Nguyễn Văn Linh
        district:
          type: string
          example: Quận 7
        province:
          type: string
          example: TP. Hồ Chí Minh
        provinceCode:
          type: string
          example: "79"
          description: Canonical/provider province code when available
        districtCode:
          type: string
          example: "1454"
          description: Carrier district code when available
        wardCode:
          type: string
          example: "21211"
          description: Carrier ward code when available
        latitude:
          type: number
          example: 10.7769
          minimum: -90
          maximum: 90
        longitude:
          type: number
          example: 106.7009
          minimum: -180
          maximum: 180
      required:
        - addressLine
        - district
        - province
    BranchDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          example: CN-HCM-01
        name:
          type: string
          example: Chi nhánh Hồ Chí Minh
        status:
          allOf:
            - $ref: "#/components/schemas/OrganizationStatus"
        phone:
          type: string
          example: 028 7300 8899
        email:
          type: string
          example: hcm@dctd.vn
        address:
          $ref: "#/components/schemas/AddressDto"
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        version:
          type: number
          example: 0
      required:
        - id
        - code
        - name
        - status
        - address
        - timezone
        - version
    BranchListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BranchDto"
        total:
          type: number
          example: 2
      required:
        - items
        - total
    WarehouseDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          example: KHO-HCM-01
        name:
          type: string
          example: Kho bán hàng Hồ Chí Minh
        status:
          allOf:
            - $ref: "#/components/schemas/OrganizationStatus"
        version:
          type: number
          example: 0
      required:
        - id
        - branchId
        - code
        - name
        - status
        - version
    WarehouseListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseDto"
        total:
          type: number
          example: 2
      required:
        - items
        - total
    ActiveLookupOptionDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          example: CN-HCM-01
        label:
          type: string
          example: Chi nhánh Hồ Chí Minh
        priceAmount:
          type: string
          example: "1990000.00"
          nullable: true
      required:
        - id
        - code
        - label
    ActiveLookupMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          example: 1
        hasMore:
          type: boolean
          example: false
      required:
        - page
        - limit
        - total
        - hasMore
    ActiveLookupResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActiveLookupOptionDto"
        meta:
          $ref: "#/components/schemas/ActiveLookupMetaDto"
      required:
        - items
        - meta
    CreateWarehouseInputDto:
      type: object
      properties:
        code:
          type: string
          example: KHO-DN-01
        name:
          type: string
          example: Kho bán hàng Đà Nẵng
      required:
        - code
        - name
    CreateBranchDto:
      type: object
      properties:
        code:
          type: string
          example: CN-DN-01
        name:
          type: string
          example: Chi nhánh Đà Nẵng
        phone:
          type: string
          example: 0236 7300 8899
        email:
          type: string
          example: danang@dctd.vn
        address:
          $ref: "#/components/schemas/AddressDto"
        warehouse:
          $ref: "#/components/schemas/CreateWarehouseInputDto"
      required:
        - code
        - name
        - address
        - warehouse
    BranchWithWarehouseDto:
      type: object
      properties:
        branch:
          $ref: "#/components/schemas/BranchDto"
        warehouse:
          $ref: "#/components/schemas/WarehouseDto"
      required:
        - branch
        - warehouse
    UpdateWarehouseDto:
      type: object
      properties:
        name:
          type: string
          example: Kho bán hàng Đà Nẵng
      required:
        - name
    UpdateBranchWithWarehouseDto:
      type: object
      properties:
        name:
          type: string
          example: Chi nhánh Đà Nẵng
        phone:
          type: string
          example: 0236 7300 8899
        email:
          type: string
          example: danang@dctd.vn
        address:
          $ref: "#/components/schemas/AddressDto"
        warehouse:
          $ref: "#/components/schemas/UpdateWarehouseDto"
        expectedVersion:
          type: number
          minimum: 0
        warehouseExpectedVersion:
          type: number
          minimum: 0
      required:
        - name
        - address
        - warehouse
        - expectedVersion
        - warehouseExpectedVersion
    ChangeBranchStatusDto:
      type: object
      properties:
        expectedVersion:
          type: number
          minimum: 0
        warehouseExpectedVersion:
          type: number
          minimum: 0
      required:
        - expectedVersion
        - warehouseExpectedVersion
    ScopeType:
      type: string
      enum:
        - GLOBAL
        - BRANCH
    UserRoleAssignmentDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        userId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        roleId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        roleCode:
          type: string
        scopeType:
          allOf:
            - $ref: "#/components/schemas/ScopeType"
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        status:
          type: string
          enum:
            - ACTIVE
        validFrom:
          type: string
          format: date-time
      required:
        - id
        - userId
        - roleId
        - roleCode
        - scopeType
        - status
        - validFrom
    UserDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        displayName:
          type: string
          example: Long Hoàng
        maskedEmail:
          type: string
          example: lo***@dctd.vn
        userType:
          type: string
          enum:
            - STAFF
            - SYSTEM
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
            - INACTIVE
        permissionVersion:
          type: number
          example: 1
        failedLoginAttempts:
          type: number
          example: 0
          minimum: 0
        mustChangePassword:
          type: boolean
          example: false
        lockedAt:
          type: string
          format: date-time
        lockReason:
          type: string
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/UserRoleAssignmentDto"
      required:
        - id
        - displayName
        - maskedEmail
        - userType
        - status
        - permissionVersion
        - failedLoginAttempts
        - mustChangePassword
        - assignments
    UserListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserDto"
        total:
          type: number
      required:
        - items
        - total
    CreateStaffUserDto:
      type: object
      properties:
        displayName:
          type: string
          example: Nguyễn Văn An
          maxLength: 255
        email:
          type: string
          example: an.nguyen@example.com
          maxLength: 255
        roleCode:
          type: string
          enum:
            - BRANCH_MANAGER
            - STAFF
        branchId:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
      required:
        - displayName
        - email
        - roleCode
        - branchId
    LockStaffUserDto:
      type: object
      properties:
        reason:
          type: string
          example: Nhân viên đã nghỉ việc
          minLength: 3
          maxLength: 255
      required:
        - reason
    RoleStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
    RoleDto:
      type: object
      properties:
        id:
          type: string
          pattern: ^[1-9][0-9]*$
          example: "1"
        code:
          type: string
          example: BRANCH_MANAGER
        name:
          type: string
          example: Branch Manager
        description:
          type: string
        status:
          allOf:
            - $ref: "#/components/schemas/RoleStatus"
        system:
          type: boolean
        permissionCodes:
          type: array
          items:
            type: string
        version:
          type: number
          example: 0
      required:
        - id
        - code
        - name
        - status
        - system
        - permissionCodes
        - version
    RoleListDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleDto"
        total:
          type: number
      required:
        - items
        - total
    PermissionDto:
      type: object
      properties:
        code:
          type: string
          example: org.branch.view
        module:
          type: string
          example: Organization
        action:
          type: string
          example: view
        sensitive:
          type: boolean
          example: false
      required:
        - code
        - module
        - action
        - sensitive
    PermissionListDto:
      type: object
      properties:
        items:
