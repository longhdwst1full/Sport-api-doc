        provider:
          allOf:
            - $ref: "#/components/schemas/MediaProvider"
        providerAssetId:
          type: string
        publicId:
          type: string
        secureUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        mimeType:
          type: string
          example: image/webp
        width:
          type: number
        height:
          type: number
        sizeBytes:
          type: number
        format:
          type: string
        providerVersion:
          type: number
          description: Cloudinary resource version used during provider verification
        status:
          type: string
          enum:
            - ACTIVE
      required:
        - id
        - provider
        - providerAssetId
        - publicId
        - secureUrl
        - thumbnailUrl
        - mimeType
        - width
        - height
        - sizeBytes
        - format
        - providerVersion
        - status
