services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dctd_utc
      POSTGRES_USER: dctd
      POSTGRES_PASSWORD: dctd_local
    ports:
      - '5432:5432'
    volumes:
      - dctd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dctd -d dctd_utc']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dctd_postgres:
