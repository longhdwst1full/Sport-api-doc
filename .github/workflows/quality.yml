name: API Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dctd_utc
          POSTGRES_USER: dctd
          POSTGRES_PASSWORD: dctd_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dctd -d dctd_utc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_MODE: serve
      DATABASE_ENABLED: "true"
      DB_MIGRATE_ON_START: "false"
      DATABASE_URL: postgresql://dctd:dctd_ci@localhost:5432/dctd_utc
      DIRECT_URL: postgresql://dctd:dctd_ci@localhost:5432/dctd_utc
      AUTH_BYPASS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prisma:migrate:deploy
      - run: yarn prisma:seed
      - run: yarn prisma:seed
      - run: yarn test:integration
      - run: yarn lint
      - run: yarn test
      - run: yarn openapi:generate
      - run: git diff --exit-code -- openapi document/api
      - run: yarn build
